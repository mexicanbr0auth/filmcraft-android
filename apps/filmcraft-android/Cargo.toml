[package]
name = "filmcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FilmCraft Android NativeActivity host"

[lib]
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
filmcraft-ui-egui = { workspace = true }
filmcraft-engine = { workspace = true }
log = { workspace = true }
